<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원 관리 · SEOUL RED</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d7001f'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white'%3E★%3C/text%3E%3C/svg%3E">
  <style>
/* ===== 기본 ===== */
:root {
  --red: #d7001f;
  --red-dark: #a80018;
  --black: #141416;
  --gray: #f4f2ef;
  --line: #e4e1dc;
  --text-sub: #6b6863;
  --gold: #c9a45c;
  --display: Impact, "Arial Narrow Bold", "Arial Black", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color: var(--black);
  line-height: 1.5;
  word-break: keep-all;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* ===== 버튼 ===== */
.btn { display: inline-block; padding: 14px 26px; border-radius: 999px; font-weight: 800; text-align: center; transition: .2s; }
.btn.red { background: var(--red); color: #fff; }
.btn.red:hover { background: var(--red-dark); }
.btn.black { background: var(--black); color: #fff; }
.btn.line { border: 1.5px solid var(--black); }
.btn.line:hover { background: var(--black); color: #fff; }
.btn.full { width: 100%; border-radius: 10px; padding: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== 상단 띠 · 헤더 ===== */
.topbar { background: var(--red); color: #fff; text-align: center; font-size: 13px; padding: 7px 12px; }
.header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); }
.header-in { display: flex; align-items: center; gap: 24px; height: 68px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 24px; letter-spacing: 1px; line-height: 1; white-space: nowrap; }
.logo small { display: block; font-family: inherit; font-size: 10px; letter-spacing: 3px; color: var(--red); margin-top: 3px; }
.logo-mark { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 18px;
  background: repeating-linear-gradient(90deg, var(--red) 0 8px, var(--black) 8px 16px); }
.nav { display: flex; gap: 4px; flex: 1; }
.nav button, .nav a { padding: 8px 14px; font-weight: 700; border-radius: 999px; transition: .2s; }
.nav button:hover, .nav a:hover { background: var(--gray); color: var(--red); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { position: relative; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; font-size: 22px; }
.icon-btn:hover { background: var(--gray); }
.icon-btn svg { width: 24px; height: 24px; }
.count { position: absolute; top: 0; right: 0; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--red);
  color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.user-btn { display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--black); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
.user-btn .g { padding: 2px 8px; border-radius: 999px; font-size: 11px; }
.user-btn.login { background: var(--red); padding: 9px 16px; }
.menu-btn { display: none; }

/* 모바일 메뉴 */
.side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 82vw); background: #fff; z-index: 40; padding: 60px 20px 20px;
  transform: translateX(-100%); transition: transform .3s; }
.side-menu.show { transform: none; }
.side-menu button, .side-menu a { display: block; width: 100%; text-align: left; padding: 14px 4px; font-size: 18px; font-weight: 800; border-bottom: 1px solid var(--line); }
.side-menu .close-side { position: absolute; top: 10px; right: 10px; width: 40px; padding: 0; border: 0; font-size: 28px; text-align: center; }
.side-dim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: none; }
.side-dim.show { display: block; }

/* ===== 메인 슬라이드 ===== */
.hero { position: relative; height: 620px; overflow: hidden; background: #000; color: #fff; }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 1s, visibility 1s; }
.slide.active { opacity: 1; visibility: visible; }
.slide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); transition: transform 7s ease-out; }
.slide.active img { transform: scale(1); }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.3) 50%, rgba(0,0,0,0) 75%); }
.slide-text { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-55%); z-index: 1; }
.slide-text > * { opacity: 0; transform: translateY(20px); transition: .7s; }
.slide.active .slide-text > * { opacity: 1; transform: none; }
.slide.active .slide-text > :nth-child(2) { transition-delay: .15s; }
.slide.active .slide-text > :nth-child(3) { transition-delay: .25s; }
.slide.active .slide-text > :nth-child(4) { transition-delay: .35s; }
.slide.active .slide-text > :nth-child(5) { transition-delay: .45s; }
.eyebrow { display: inline-block; background: var(--red); padding: 5px 12px; font-weight: 800; letter-spacing: 3px; font-size: 12px; }
.slide h2 { font-family: var(--display); font-weight: 400; font-size: 92px; line-height: .98; margin: 18px 0 12px; letter-spacing: 1px; }
.slide h2 em { font-style: normal; color: var(--red); }
.slide .ko { font-size: 26px; font-weight: 800; }
.slide .sub { color: rgba(255,255,255,.8); margin: 6px 0 26px; }
.hero-ctrl { position: absolute; left: 0; right: 0; bottom: 30px; z-index: 2; display: flex; align-items: center; gap: 16px; }
.bars { display: flex; gap: 8px; flex: 1; }
.bars button { position: relative; width: 60px; height: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
.bars button::before { content: ""; position: absolute; inset: -10px 0; }
.bars i { position: absolute; inset: 0; background: #fff; transform: scaleX(0); transform-origin: left; }
.bars button.done i { transform: scaleX(1); background: rgba(255,255,255,.6); }
.bars button.on i { animation: fill 6s linear forwards; }
@keyframes fill { to { transform: scaleX(1); } }
.counter { font-family: var(--display); font-size: 18px; letter-spacing: 2px; }
.counter b { color: var(--red); font-weight: 400; }
.arrow { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.6); color: #fff; font-size: 26px; line-height: 1; }
.arrow:hover { background: #fff; color: var(--black); }

/* 흐르는 글자 띠 */
.ticker { background: var(--black); color: #fff; overflow: hidden; white-space: nowrap; border-top: 4px solid var(--red); }
.ticker-track { display: inline-flex; padding: 14px 0; animation: tick 30s linear infinite; }
.ticker span { font-family: var(--display); font-size: 22px; letter-spacing: 2px; padding: 0 22px; }
.ticker span::after { content: "★"; color: var(--red); margin-left: 44px; font-size: 16px; }
@keyframes tick { to { transform: translateX(-50%); } }

/* ===== 섹션 공통 ===== */
.section { padding: 80px 0; }
.section.no-top { padding-top: 0; }
.section.gray { background: var(--gray); }
.section.dark { background: var(--black); color: #fff; }
.kicker { font-family: var(--display); color: var(--red); letter-spacing: 3px; font-size: 15px; }
.sec-title { font-size: 34px; letter-spacing: -1px; margin: 4px 0 24px; }
.sec-sub { color: #bbb; margin: -14px 0 28px; }

/* 분류 카드 */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cat { background: var(--gray); border-radius: 16px; padding: 18px; text-align: left; transition: .25s; }
.cat img { border-radius: 12px; aspect-ratio: 16 / 10; object-fit: cover; width: 100%; mix-blend-mode: multiply; transition: .4s; }
.cat b { display: block; font-size: 19px; margin-top: 12px; }
.cat small { color: var(--text-sub); }
.cat:hover { background: var(--red); color: #fff; transform: translateY(-4px); }
.cat:hover small { color: rgba(255,255,255,.8); }

/* 유니폼 카드 */
.kits { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; }
.kit { position: relative; min-height: 440px; border-radius: 16px; overflow: hidden; color: #fff; text-align: left;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 26px; isolation: isolate; }
.kit img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .6s; }
.kit::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(0,0,0,.8), rgba(0,0,0,0) 55%); }
.kit:hover img { transform: scale(1.05); }
.kit .tag { position: absolute; top: 20px; left: 20px; background: var(--red); font-family: var(--display); letter-spacing: 2px; padding: 4px 10px; font-size: 14px; }
.kit .tag.gold { background: var(--gold); color: #1b1407; }
.kit b { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; }
.kit small { opacity: .85; margin-top: 4px; }

/* ===== 상품 목록 ===== */
.toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { padding: 9px 18px; background: #fff; border: 1.5px solid var(--line); border-radius: 999px; font-weight: 700; }
.tabs button.on { background: var(--black); border-color: var(--black); color: #fff; }
.tabs .n { opacity: .55; margin-left: 4px; }
.tool-right { display: flex; gap: 8px; flex-wrap: wrap; }
.search { display: flex; background: #fff; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; min-width: 0; }
.search input { border: 0; outline: 0; padding: 8px 16px; width: 190px; min-width: 0; }
.search button { background: var(--red); color: #fff; padding: 0 18px; font-weight: 700; }
.sort { padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; font-weight: 700; height: 42px; }
.result { color: var(--text-sub); font-size: 14px; margin: 8px 0 12px; min-height: 21px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px 18px; }
.card { cursor: pointer; }
.card .thumb { position: relative; border-radius: 14px; overflow: hidden; background: #fff; aspect-ratio: 1; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s, opacity .4s; }
.card .thumb img.back { position: absolute; inset: 0; opacity: 0; }
.card:hover .thumb img { transform: scale(1.05); }
.card:hover .thumb img.back { opacity: 1; }
.labels { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; z-index: 1; }
.lb { font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 3px 8px; border-radius: 4px; background: var(--black); color: #fff; }
.lb.NEW { background: var(--red); }
.lb.LIMITED { background: var(--gold); color: #1b1407; }
.lb.SALE { background: #fff; color: var(--red); border: 1.5px solid var(--red); }
.lb.SOLDOUT { background: #999; }
.lb.LOW { background: #fff; color: var(--black); border: 1.5px solid var(--black); }
.card .cat-name { font-size: 12px; color: var(--text-sub); margin-top: 12px; font-weight: 700; }
.card h4 { font-size: 16px; }
.price { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.price .off { color: var(--red); font-weight: 900; font-size: 17px; }
.price .now { font-weight: 900; font-size: 17px; }
.price del { color: var(--text-sub); font-size: 13px; }
.card .earn { font-size: 12px; color: var(--red); font-weight: 700; }
.empty { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-sub); }

/* ===== 마킹 안내 ===== */
.marking { position: relative; background: var(--red); color: #fff; overflow: hidden; }
.marking::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 70px, rgba(0,0,0,.18) 70px 140px); }
.marking-in { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; min-height: 460px; padding-top: 50px; padding-bottom: 50px; }
.marking h3 { font-family: var(--display); font-weight: 400; font-size: 76px; line-height: .98; }
.marking .ko { font-size: 24px; font-weight: 900; margin: 12px 0 6px; }
.marking ul { list-style: none; display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 24px; }
.marking li { background: rgba(0,0,0,.28); padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.shirt { position: relative; justify-self: center; width: min(400px, 100%); border-radius: 22px; overflow: hidden; transform: rotate(3deg); box-shadow: 0 40px 60px -20px rgba(0,0,0,.5); }
.shirt span { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 32px; letter-spacing: 4px; }

/* ===== 등급 ===== */
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grade { position: relative; overflow: hidden; background: #222226; border-radius: 16px; padding: 24px; border: 1px solid rgba(255,255,255,.08); transition: .3s; }
.grade:hover { transform: translateY(-6px); border-color: var(--c); }
.grade::before { content: ""; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; border-radius: 50%; background: var(--c); opacity: .18; }
.grade.mine { outline: 2px solid var(--c); }
.grade .lv { font-family: var(--display); letter-spacing: 3px; font-size: 13px; color: var(--c); }
.grade h4 { font-size: 24px; }
.grade .rate { font-family: var(--display); font-size: 60px; line-height: 1.1; color: var(--c); }
.grade .rate small { font-family: inherit; font-size: 18px; color: #fff; }
.grade .cond { color: #aaa; font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.1); }
.grade ul { list-style: none; margin-top: 12px; font-size: 14px; display: grid; gap: 6px; }
.grade li::before { content: "✓ "; color: var(--c); font-weight: 900; }
.policy { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 32px; background: rgba(255,255,255,.12); border-radius: 14px; overflow: hidden; }
.policy div { background: var(--black); padding: 20px 22px; }
.policy b { display: block; font-size: 21px; }
.policy span { font-size: 13px; color: #aaa; }

/* ===== 푸터 ===== */
.footer { background: #0b0b0c; color: #888; padding: 40px 0; font-size: 13px; }
.footer .logo { color: #fff; margin-bottom: 8px; }

/* ===== 팝업 (dialog) ===== */
.dlg { margin: auto; border: 0; border-radius: 18px; padding: 28px; width: min(460px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; }
.dlg.wide { width: min(900px, calc(100vw - 24px)); }
.dlg::backdrop { background: rgba(0,0,0,.55); }
.dlg h3 { font-size: 22px; margin-bottom: 16px; }
.close { position: sticky; top: 0; float: right; font-size: 26px; width: 36px; height: 36px; margin: -12px -12px 0 0; z-index: 1; }
.drawer { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; border-radius: 0; width: min(420px, 100vw); }
.dlg label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.dlg input:not([type=checkbox]):not([type=radio]), .dlg select { display: block; width: 100%; margin-top: 4px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; }
.dlg input:focus, .dlg select:focus { outline: 0; border-color: var(--black); }
.check { display: flex !important; gap: 8px; align-items: flex-start; font-weight: 400 !important; }
.check input { accent-color: var(--red); margin-top: 3px; }
.error { color: var(--red); font-size: 13px; min-height: 20px; margin-bottom: 6px; }
.notice { background: #fff1f2; color: var(--red-dark); padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--gray); border-radius: 10px; padding: 4px; margin: 0 28px 20px 0; }
.auth-tabs button { padding: 10px; border-radius: 8px; font-weight: 700; color: var(--text-sub); }
.auth-tabs button.on { background: #fff; color: var(--black); }

/* 상품 상세 */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; clear: both; }
.detail .main-img { border-radius: 14px; background: var(--gray); }
.thumbs { display: flex; gap: 8px; margin-top: 8px; }
.thumbs button { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; opacity: .6; }
.thumbs button.on { border-color: var(--black); opacity: 1; }
.detail h2 { font-size: 24px; margin: 4px 0 6px; }
.detail .price .now, .detail .price .off { font-size: 26px; }
.detail .desc { color: var(--text-sub); margin: 12px 0; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.opt-title { font-weight: 800; font-size: 14px; margin: 14px 0 8px; }
.sizes { display: flex; gap: 6px; flex-wrap: wrap; }
.sizes button { min-width: 50px; height: 42px; border: 1.5px solid var(--line); border-radius: 8px; font-weight: 800; }
.sizes button.on { background: var(--black); border-color: var(--black); color: #fff; }
.mark-box { background: var(--gray); border-radius: 10px; padding: 12px; margin-top: 8px; display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.mark-box label { margin: 0; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
.qty button { width: 36px; height: 36px; font-size: 18px; }
.qty button:disabled { opacity: .3; }
.qty span { min-width: 32px; text-align: center; font-weight: 700; }
.pd-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.pd-total b { font-size: 24px; }
.detail .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }

/* 장바구니 · 주문 목록 */
.item { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--gray); }
.item h5 { font-size: 14px; }
.item .sub { font-size: 12px; color: var(--text-sub); }
.item .right { text-align: right; }
.del { font-size: 12px; color: var(--text-sub); text-decoration: underline; }
.row { display: flex; justify-content: space-between; padding: 4px 0; }
.row.total { font-size: 18px; font-weight: 900; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
.row.total b { color: var(--red); }
.summary { margin-top: 16px; }
.ship-bar { background: var(--gray); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 8px; }
.ship-bar .bar-bg { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.ship-bar .bar-bg i { display: block; height: 100%; background: var(--red); }

/* 결제 */
.checkout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; clear: both; }
.box { background: var(--gray); border-radius: 12px; padding: 18px; }
.point-row { display: flex; gap: 6px; }
.point-row .btn { padding: 0 14px; border-radius: 8px; white-space: nowrap; margin-top: 4px; }
.pays { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.pays input { accent-color: var(--red); }
.pays label { margin: 0; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; display: flex; gap: 6px; align-items: center; cursor: pointer; background: #fff; }
.pays label:has(input:checked) { border-color: var(--red); color: var(--red); }

/* 마이페이지 */
.member-card { position: relative; overflow: hidden; background: var(--black); color: #fff; border-radius: 16px; padding: 22px; clear: both; }
.member-card::after { content: ""; position: absolute; right: -50px; bottom: -50px; width: 180px; height: 180px; border-radius: 50%; background: var(--c); opacity: .4; }
.member-card > * { position: relative; z-index: 1; }
.member-card .g { color: var(--c); font-family: var(--display); font-size: 38px; line-height: 1; }
.bar { height: 8px; background: #333; border-radius: 4px; margin: 14px 0 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); }
.my-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.my-stats div { background: var(--gray); border-radius: 10px; padding: 12px; text-align: center; }
.my-stats b { display: block; font-size: 17px; }
.my-stats span { font-size: 12px; color: var(--text-sub); }
.my-tabs { display: flex; gap: 4px; margin: 18px 0 4px; border-bottom: 1px solid var(--line); }
.my-tabs button { padding: 10px 12px; font-weight: 700; color: var(--text-sub); border-bottom: 2px solid transparent; }
.my-tabs button.on { color: var(--black); border-color: var(--red); }
.plus { color: var(--red); font-weight: 800; }
.done-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--red); color: #fff; font-size: 32px; display: grid; place-items: center; margin: 0 auto 12px; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 80px); background: var(--black); color: #fff;
  padding: 12px 20px; border-radius: 999px; font-weight: 700; font-size: 14px; transition: .3s; z-index: 100; max-width: calc(100vw - 32px);
  opacity: 0; visibility: hidden; }
.toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

/* ===== 반응형 ===== */
@media (max-width: 960px) {
  .nav { display: none; }
  .menu-btn { display: grid; }
  .grid, .grades, .policy { grid-template-columns: repeat(2, 1fr); }
  .kits { grid-template-columns: 1fr 1fr; }
  .kits .kit:first-child { grid-column: 1 / -1; }
  .detail, .checkout, .marking-in { grid-template-columns: 1fr; }
  .slide h2 { font-size: 68px; }
}
@media (max-width: 640px) {
  .pc-only { display: none; }
  .header-in { gap: 6px; height: 60px; }
  .logo { flex: 1; font-size: 19px; }
  .logo small { display: none; }
  .logo-mark { width: 32px; height: 32px; }
  .user-btn { padding: 6px 10px 6px 6px; font-size: 12px; }
  .user-btn .nm { display: none; }
  .hero { height: 540px; }
  .slide::after { background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 75%); }
  .slide-text { top: auto; bottom: 80px; transform: none; }
  .slide h2 { font-size: 46px; }
  .slide .ko { font-size: 20px; }
  .slide .sub { margin-bottom: 18px; }
  .arrow { display: none; }
  .bars button { width: 36px; }
  .section { padding: 56px 0; }
  .sec-title { font-size: 25px; }
  .cats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .cat { padding: 10px; }
  .cat b { font-size: 15px; }
  .cat small { display: none; }
  .kits { grid-template-columns: 1fr; }
  .kit { min-height: 320px; }
  .tool-right, .search { width: 100%; }
  .search { flex: 1; }
  .search input { flex: 1; width: auto; }
  .grid { gap: 22px 12px; }
  .grades, .policy { grid-template-columns: 1fr; }
  .marking h3 { font-size: 52px; }
  .dlg { padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
  <style>
    .admin-main { padding: 36px 0 80px; }
    .admin-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 28px; }
    .stat { background: var(--gray); border-radius: 12px; padding: 14px 16px; border-top: 4px solid var(--c, var(--black)); }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: var(--text-sub); }
    .panel { border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 24px; }
    .panel h3 { font-size: 20px; margin-bottom: 12px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters input, .filters select { height: 40px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 8px; min-width: 0; }
    .filters input { flex: 1; max-width: 280px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 12px; color: var(--text-sub); }
    td input, td select { height: 34px; padding: 0 8px; border: 1.5px solid var(--line); border-radius: 6px; }
    td input[type=number] { width: 100px; }
    td .btn { padding: 7px 14px; font-size: 13px; }
    .g-badge { color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
    .note { color: var(--text-sub); font-size: 13px; }
    .gate { text-align: center; padding: 120px 20px; color: var(--text-sub); }
    @media (max-width: 900px) { .stats { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } .filters input { max-width: none; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="wrap header-in">
      <a href="index.html" class="logo">
        <span class="logo-mark">★</span>
        <span>SEOUL RED<small>ADMIN</small></span>
      </a>
      <div style="flex:1"></div>
      <div class="header-actions">
        <span class="note" id="whoami"></span>
        <a class="user-btn login" href="index.html">쇼핑몰로</a>
      </div>
    </div>
  </header>

  <main class="wrap admin-main" id="app">
    <p class="gate" id="gate">관리자인지 확인하는 중…</p>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* ===== Supabase 연결 (쇼핑몰과 같은 주소 · 공개 키) ===== */
    const SUPABASE_URL = "https://hdpxtzegvztabnybvbnt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R0L2Vv8NAnNllbKcHqpzHw_XqbxqdCB";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ===== 등급: DB 값(code) ↔ 화면 이름 ===== */
    const GRADES = [
      { code: "WELCOME", name: "루키",   color: "#9aa0a6" },
      { code: "SILVER",  name: "레귤러", color: "#ff5a6b" },
      { code: "GOLD",    name: "서포터", color: "#d7001f" },
      { code: "VIP",     name: "레전드", color: "#c9a45c" }
    ];
    const STATUSES = ["결제완료", "배송중", "배송완료", "취소"];
    const gradeOf = code => GRADES.find(g => g.code === code) || GRADES[0];

    const $ = s => document.querySelector(s);
    const won = n => (n || 0).toLocaleString("ko-KR") + "원";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function toast(msg) {
      const t = $("#toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(t.timer); t.timer = setTimeout(() => t.classList.remove("show"), 2400);
    }

    let members = [];
    let orders = [];
    let keyword = "";
    let gradeFilter = "all";

    /* ① 관리자가 아니면 index.html 로 돌려보낸다 */
    async function guard() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { location.replace("index.html"); return false; }
      const { data, error } = await db.from("shop_profiles").select("role, name").eq("id", session.user.id).single();
      if (error || !data || data.role !== "admin") { location.replace("index.html"); return false; }
      $("#whoami").textContent = `${data.name || session.user.email} (관리자)`;
      return true;
    }

    /* ② 회원 · 주문 읽기 (관리자는 보안 규칙상 모두 볼 수 있다) */
    async function load() {
      const [m, o] = await Promise.all([
        db.from("shop_profiles").select("*").order("created_at", { ascending: false }),
        db.from("shop_orders").select("*").order("id", { ascending: false })
      ]);
      if (m.error) { $("#app").innerHTML = `<p class="gate">회원을 불러오지 못했어요: ${esc(m.error.message)}</p>`; return; }
      members = m.data;
      orders = o.error ? [] : o.data;
      render();
    }

    function render() {
      // 요약 숫자 (COUNT · SUM · GROUP BY)
      const byGrade = GRADES.map(g => ({ ...g, n: members.filter(x => x.grade === g.code).length }));
      const validOrders = orders.filter(x => x.status !== "취소");
      const sum = validOrders.reduce((s, x) => s + x.total, 0);

      // 회원 목록 (이름 검색 · 등급 필터 = WHERE · LIKE)
      const list = members.filter(x =>
        (gradeFilter === "all" || x.grade === gradeFilter) &&
        (x.name || "").toLowerCase().includes(keyword.toLowerCase())
      );
      const nameOf = id => (members.find(x => x.id === id) || {}).name || "-";

      $("#app").innerHTML = `
        <div class="admin-head">
          <div><p class="kicker">ADMIN</p><h2 class="sec-title" style="margin:0">회원 관리</h2></div>
          <button class="btn line" id="reload">새로고침</button>
        </div>

        <div class="stats">
          <div class="stat"><b>${members.length}명</b><span>전체 회원</span></div>
          ${byGrade.map(g => `<div class="stat" style="--c:${g.color}"><b>${g.n}명</b><span>${g.name} (${g.code})</span></div>`).join("")}
          <div class="stat" style="--c:var(--red)"><b>${won(sum)}</b><span>주문 합계 · ${validOrders.length}건</span></div>
        </div>

        <section class="panel">
          <h3>회원 목록</h3>
          <div class="filters">
            <input id="q" placeholder="이름으로 검색" value="${esc(keyword)}">
            <select id="gf">
              <option value="all">전체 등급</option>
              ${GRADES.map(g => `<option value="${g.code}" ${gradeFilter === g.code ? "selected" : ""}>${g.name} (${g.code})</option>`).join("")}
            </select>
          </div>
          <p class="note" style="margin-bottom:8px">${list.length}명 · 등급 · 포인트 · 역할을 고친 뒤 저장을 누르세요.</p>
          <div class="table-wrap">
            <table>
              <thead><tr><th>이름</th><th>이메일</th><th>연락처</th><th>등급</th><th>포인트</th><th>역할</th><th>누적 구매</th><th>가입일</th><th></th></tr></thead>
              <tbody>
                ${list.map(x => `
                  <tr data-id="${x.id}">
                    <td><b>${esc(x.name || "-")}</b></td>
                    <td>${esc(x.email)}</td>
                    <td>${esc(x.phone || "-")}</td>
                    <td><select data-f="grade">${GRADES.map(g => `<option value="${g.code}" ${x.grade === g.code ? "selected" : ""}>${g.name}</option>`).join("")}</select></td>
                    <td><input type="number" min="0" step="100" data-f="points" value="${x.points}"></td>
                    <td><select data-f="role"><option value="member" ${x.role === "member" ? "selected" : ""}>회원</option><option value="admin" ${x.role === "admin" ? "selected" : ""}>관리자</option></select></td>
                    <td>${won(x.total_spent)}</td>
                    <td>${new Date(x.created_at).toLocaleDateString("ko-KR")}</td>
                    <td><button class="btn red" data-save>저장</button></td>
                  </tr>`).join("") || `<tr><td colspan="9" class="note" style="text-align:center;padding:30px">조건에 맞는 회원이 없어요.</td></tr>`}
              </tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <h3>주문 목록</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>주문번호</th><th>주문자</th><th>받는 분</th><th>결제 금액</th><th>포인트 사용</th><th>결제 수단</th><th>주문일</th><th>상태</th></tr></thead>
              <tbody>
                ${orders.map(o => `
                  <tr data-order="${o.id}">
                    <td>#${o.id}</td>
                    <td>${esc(nameOf(o.user_id))}</td>
                    <td>${esc(o.receiver || "-")}</td>
                    <td><b>${won(o.total)}</b></td>
                    <td>${won(o.used_point)}</td>
                    <td>${esc(o.pay_method || "-")}</td>
                    <td>${new Date(o.created_at).toLocaleDateString("ko-KR")}</td>
                    <td><select data-status>${STATUSES.map(s => `<option ${o.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></td>
                  </tr>`).join("") || `<tr><td colspan="8" class="note" style="text-align:center;padding:30px">아직 주문이 없어요.</td></tr>`}
              </tbody>
            </table>
          </div>
        </section>`;
    }

    /* ③ 저장: shop_admin_update_member 함수 호출 · 주문 상태 바꾸기 */
    document.addEventListener("click", async e => {
      if (e.target.id === "reload") { await load(); toast("새로 불러왔어요"); }
      const save = e.target.closest("[data-save]");
      if (save) {
        const row = save.closest("tr");
        const points = Number(row.querySelector('[data-f="points"]').value);
        if (!Number.isInteger(points) || points < 0) { toast("포인트는 0 이상의 정수로 넣어 주세요"); return; }
        save.disabled = true;
        const { error } = await db.rpc("shop_admin_update_member", {
          p_user_id: row.dataset.id,
          p_grade: row.querySelector('[data-f="grade"]').value,
          p_points: points,
          p_role: row.querySelector('[data-f="role"]').value
        });
        save.disabled = false;
        if (error) { toast("저장하지 못했어요: " + error.message); return; }
        toast("저장했어요");
        await load();
      }
    });
    document.addEventListener("change", async e => {
      if (e.target.id === "gf") { gradeFilter = e.target.value; render(); }
      if (e.target.matches("[data-status]")) {
        const id = Number(e.target.closest("tr").dataset.order);
        const { error } = await db.from("shop_orders").update({ status: e.target.value }).eq("id", id);
        if (error) { toast("상태를 바꾸지 못했어요: " + error.message); await load(); return; }
        toast(`주문 #${id} → ${e.target.value}`);
        await load();
      }
    });
    document.addEventListener("input", e => {
      if (e.target.id === "q") {
        keyword = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos);
      }
    });

    guard().then(ok => { if (ok) load(); });
  </script>
</body>
</html>
